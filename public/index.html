            ]) : null,

            /* Per-file list */
            stats && stats.files ? h('div', { className: 'scanner-file-list', key: 'flist' },
              filteredScanFiles.map((f, i) =>
                h('div', {
                  className: 'scanner-file-item' + (selectedScanFile && selectedScanFile.filePath === f.filePath ? ' active' : ''),
                  key: f.filePath + i,
                  onClick: () => setSelectedScanFile(f)
                }, [
                  h('span', {
                    className: 'scanner-file-score',
                    key: 'score',
                    style: {
                      background: scoreColor(f.coverageScore) + '22',
                      color: scoreColor(f.coverageScore),
                      border: '1px solid ' + scoreColor(f.coverageScore) + '44'
                    }
                  }, f.coverageScore),
                  h('span', { className: 'scanner-file-path', key: 'path' }, f.filePath),
                  h('span', { className: 'scanner-file-role', key: 'role' }, f.role)
                ])
              )
            ) : (!scanRunning && !s)
              ? h('div', { className: 'scan-cta-section', key: 'cta' }, [
                  h('div', { className: 'scan-cta-icon', key: 'i' }, '⚡'),
                  h('div', { className: 'scan-cta-title', key: 't' }, 'Scan a repository'),
                  h('div', { className: 'scan-cta-desc', key: 'd' }, 'Enter a repository path above and click Scan to extract API routes, DB tables, and flow steps.')
                ])
              : scanStatsLoading
                ? h('div', { key: 'loading', style: { padding: 16, textAlign: 'center', color: 'var(--text-muted)', fontSize: 11 } }, 'Loading…')
                : null
          ]);
        }

        /* ---- Main Canvas ---- */
        const mainCanvas = h('main', { className: 'main-canvas', key: 'main-canvas' }, [
          h(BubbleGraph, { key: 'bg', apis: filteredApis, selectedId, onSelectApi, onHoverApi }),
          tooltip ? h('div', {
            className: 'bubble-tooltip visible', key: 'tooltip',
            style: {
              left: Math.min(tooltip.x + 12, window.innerWidth - 280) + 'px',
              top: (tooltip.y - 60) + 'px'
            }
          }, [
            h('div', { className: 'tt-method', key: 'm', style: { color: methodColor(tooltip.api.method) } }, tooltip.api.method),
            h('div', { className: 'tt-path', key: 'p' }, tooltip.api.path),
            h('div', { className: 'tt-summary', key: 's' }, truncate(tooltip.api.summary, 120)),
            tooltip.api.tables && tooltip.api.tables.length > 0 ?
              h('div', { key: 'tables', style: { fontSize: 9, color: 'var(--teal)', marginTop: 4 } },
                '🗄 ' + tooltip.api.tables.join(', ')) : null,
            h('div', { style: { fontSize: 9, color: '#5a6478', marginTop: 4 }, key: 'hint' }, 'Click to select • Double-click for flow')
          ]) : null,
          h('div', { className: 'canvas-footer', key: 'footer' }, [
            h('div', { className: 'canvas-legend', key: 'legend' }, [
              h('div', { className: 'legend-item', key: 'get' }, [h('div', { className: 'legend-dot', style: { background: '#00d4b1' }, key: 'd' }), 'GET']),
              h('div', { className: 'legend-item', key: 'post' }, [h('div', { className: 'legend-dot', style: { background: '#4f7cff' }, key: 'd' }), 'POST']),
              h('div', { className: 'legend-item', key: 'put' }, [h('div', { className: 'legend-dot', style: { background: '#ffb340' }, key: 'd' }), 'PUT']),
              h('div', { className: 'legend-item', key: 'patch' }, [h('div', { className: 'legend-dot', style: { background: '#a78bfa' }, key: 'd' }), 'PATCH']),
              h('div', { className: 'legend-item', key: 'del' }, [h('div', { className: 'legend-dot', style: { background: '#ff4d9e' }, key: 'd' }), 'DELETE']),
            ]),
            selectedApi ? h('button', {
              className: 'btn-sm btn-primary', key: 'view-flow',
              onClick: () => setFlowApi(selectedApi)
            }, '⚡ Flow: ' + selectedApi.method + ' ' + truncate(selectedApi.path, 20)) : null
          ])
        ]);

        /* ---- Right Panel (Issue #3: separate sections) ---- */
        const rightPanel = h('aside', { className: 'right-panel', key: 'right-panel' }, [
          h('div', { className: 'right-panel-header', key: 'header' }, [
            h('h3', { key: 't' }, activeNav === 'scanner'
              ? (selectedScanFile ? 'File Details' : 'Scanner')
              : (selectedApi ? 'API Details' : 'API Explorer'))
          ]),
          h('div', { className: 'right-panel-body', key: 'body' }, [
            activeNav === 'scanner'
              ? (selectedScanFile
                  ? renderScanFileDetail(selectedScanFile)
                  : h('div', { key: 'no-sel', style: { padding: '24px 14px', textAlign: 'center' } }, [
                      h('div', { style: { fontSize: 28, opacity: 0.15, marginBottom: 8 }, key: 'i' }, '◎'),
                      h('div', { style: { fontSize: 12, color: 'var(--text-muted)' }, key: 't' }, 'Click a file to view parse details.'),
                    ])
                )
              : (selectedApi
                  ? h(ApiDetailsPanel, { key: 'details', api: selectedApi, onViewFlow: () => setFlowApi(selectedApi) })
                  : h('div', { key: 'no-sel', style: { padding: '24px 14px', textAlign: 'center' } }, [
                      h('div', { style: { fontSize: 28, opacity: 0.15, marginBottom: 8 }, key: 'i' }, '◎'),
                      h('div', { style: { fontSize: 12, color: 'var(--text-muted)' }, key: 't' }, 'Click a bubble to view API details.'),
                      h('div', { style: { fontSize: 10, color: 'var(--text-muted)', marginTop: 6, lineHeight: 1.5 }, key: 's' },
                        'Use the ⚡ Impact tab to analyze which APIs are affected by database changes.')
                    ])),
            error ? h('div', { className: 'error-banner', key: 'err' }, error) : null
          ])
        ]);

        /* ---- Flow Overlay ---- */
        const overlay = flowApi ? h(FlowOverlay, { key: 'flow-overlay', api: flowApi, onClose: () => setFlowApi(null) }) : null;

        /* ---- AI Status Banner ---- */
        const showBanner = !bannerDismissed && aiStatus &&
          (aiStatus.state === 'parser_only' || aiStatus.state === 'prompt_ready');

        const bannerRepoName = activeRepoPath ? activeRepoPath.split('/').pop() : 'this repo';
        const scanPromptCmd = 'routeweave scan-prompt ' + (activeRepoPath || '.');
        const aiInstructionText = 'Follow the instructions in ' + (activeRepoPath || '.') + '/.routeweave/SCAN_INSTRUCTIONS.md';

        function copyToClipboard(text) {
          navigator.clipboard.writeText(text).catch(() => {});
          setCmdCopied(true);
          setTimeout(() => setCmdCopied(false), 2000);
        }

        const aiBanner = showBanner
          ? h('div', {
              className: 'ai-banner ' + (aiStatus.state === 'prompt_ready' ? 'prompt-ready' : 'parser-only'),
              key: 'ai-banner',
            }, [
              h('div', { className: 'ai-banner-icon', key: 'ic' },
                aiStatus.state === 'prompt_ready' ? '🤖' : '⚡'
              ),
              h('div', { className: 'ai-banner-body', key: 'body' }, [
                aiStatus.state === 'parser_only'
                  ? h('div', { className: 'ai-banner-title', key: 't' },
                      'Parser complete — AI enrichment needed for ' + bannerRepoName)
                  : h('div', { className: 'ai-banner-title', key: 't' },
                      'AI prompt ready — open it in your AI assistant'),

                aiStatus.state === 'parser_only'
                  ? h('div', { className: 'ai-banner-desc', key: 'd' },
                      'The current data shows mechanical, low-fidelity summaries. Run the command below to generate an AI prompt, then pass it to Claude, Copilot, or Cursor for rich business-language descriptions.')
                  : h('div', { className: 'ai-banner-desc', key: 'd' },
                      'SCAN_INSTRUCTIONS.md has been generated. Open it in your AI assistant and tell it to follow the instructions — it will write the enriched api_knowledge.json for you.'),

                h('div', { className: 'ai-banner-actions', key: 'actions' }, [
                  aiStatus.state === 'parser_only'
                    ? h('div', {
                        className: 'ai-banner-cmd',
                        key: 'cmd',
                        onClick: () => copyToClipboard(scanPromptCmd),
                        title: 'Click to copy',
                      }, [
                        h('span', { key: 'txt' }, scanPromptCmd),
                        h('span', { className: cmdCopied ? 'copy-ok' : 'copy-icon', key: 'ic' }, cmdCopied ? '✓ copied' : '⎘'),
                      ])
                    : h('div', {
                        className: 'ai-banner-cmd',
                        key: 'cmd2',
                        onClick: () => copyToClipboard(aiInstructionText),
                        title: 'Click to copy',
                      }, [
                        h('span', { key: 'txt' }, '"' + aiInstructionText + '"'),
                        h('span', { className: cmdCopied ? 'copy-ok' : 'copy-icon', key: 'ic' }, cmdCopied ? '✓ copied' : '⎘'),
                      ]),
                ])
              ]),
              h('button', {
                className: 'ai-banner-dismiss', key: 'dismiss',
                onClick: () => setBannerDismissed(true),
                title: 'Dismiss',
              }, '×'),
            ])
          : null;

        /** Called by SetupWizard when user picks an existing repo to switch to */
        async function onWizardSwitchRepo(repoPath) {
          await switchRepo(repoPath);
        }

        const showRightPanel = (activeNav === 'scanner' && selectedScanFile) || (activeNav !== 'scanner' && selectedApi);

        return h('div', { className: 'app-shell' + (showBanner ? ' has-banner' : '') + (!showRightPanel ? ' no-right-panel' : '') }, [
          iconSidebar,
          topbar,
          aiBanner,
          leftPanelContent,
          mainCanvas,
          showRightPanel ? rightPanel : null,
          overlay,
          /* Setup Wizard overlay — shown on first load or when user clicks Change Project */
          wizardChecked && showWizard
            ? h(SetupWizard, {
                key: 'setup-wizard',
                rescanRepo: rescanRepo,
                onComplete: async () => {
                  await fetchRepos();
                  await fetchAiStatus();
                  await reloadData();
                  setShowWizard(false);
                  setRescanRepo(null);
                },
                onSwitchRepo: onWizardSwitchRepo,
              })
            : null
        ]);
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
