  <body>
    <div id="root"></div>
    <script>
      const { useEffect, useMemo, useState, useRef, useCallback } = React;

      const fallbackApis = [
        {
          method: 'GET', path: '/api/graph',
          summary: 'Returns generated API dependency graph data for visualization.',
          flow: ['Receive request from UI explorer', 'Read .routeweave/graph.json from cache files', 'Respond with graph payload'],
          tables: [], services: [], dependencies: ['express'], caches: ['.routeweave/graph.json'], queues: [], tableAccess: []
        },
        {
          method: 'GET', path: '/api/apis',
          summary: 'Returns API knowledge summaries from cache for endpoint navigation.',
          flow: ['Receive request from UI explorer', 'Read .routeweave/api_knowledge.json from cache', 'Flatten API entries and return list'],
          tables: [], services: [], dependencies: ['express'], caches: ['.routeweave/api_knowledge.json'], queues: [], tableAccess: []
        },
        {
          method: 'GET', path: '/api/accounts/:accountId',
          summary: 'Reads profile columns and updates the account audit trail.',
          flow: [
            'Read accounts.id, accounts.status, accounts.tier to build response payload',
            'Call Auth0 to validate access token before reading account',
            'Update account_audit.last_viewed_at for recent activity tracking',
            'Return enriched account information to the caller'
          ],
          tables: ['accounts', 'account_audit'], services: ['Auth0'], dependencies: ['express', 'jsonwebtoken'], caches: [], queues: [],
          tableAccess: [
            { table: 'accounts', columns: ['id', 'status', 'tier'], operations: ['SELECT'], evidence: ['select id, status, tier from accounts where id = ?'] },
            { table: 'account_audit', columns: ['last_viewed_at', 'account_id'], operations: ['UPDATE'], evidence: ['update account_audit set last_viewed_at = now()'] }
          ]
        }
      ];

      /* ---- Utility functions ---- */
      function methodBadgeClass(method) { return 'mb-' + String(method || '').toLowerCase(); }

      function methodColor(method) {
        const m = String(method || '').toUpperCase();
        if (m === 'GET') return '#00d4b1';
        if (m === 'POST') return '#4f7cff';
        if (m === 'PUT') return '#ffb340';
        if (m === 'PATCH') return '#a78bfa';
        if (m === 'DELETE') return '#ff4d9e';
        return '#4f7cff';
      }

      function methodGlow(method) {
        const m = String(method || '').toUpperCase();
        if (m === 'GET') return 'rgba(0,212,177,0.25)';
        if (m === 'POST') return 'rgba(79,124,255,0.25)';
        if (m === 'PUT') return 'rgba(255,179,64,0.25)';
        if (m === 'PATCH') return 'rgba(167,139,250,0.25)';
        if (m === 'DELETE') return 'rgba(255,77,158,0.25)';
        return 'rgba(79,124,255,0.25)';
      }

      function dedupeStrings(values) {
        const out = [], seen = new Set();
        for (const v of values || []) {
          const t = String(v || '').trim();
          if (!t) continue;
          const k = t.toLowerCase();
          if (seen.has(k)) continue;
          seen.add(k);
          out.push(t);
        }
        return out;
      }

      /* Group APIs by their primary domain (first meaningful path segment) */
      function getApiGroup(api) {
        const skipPrefixes = new Set(['api', 'v1', 'v2', 'v3', 'v4']);
        const parts = (api.path || '').replace(/^\//, '').split('/').filter(p => p && !p.startsWith(':'));
        for (const p of parts) {
          if (!skipPrefixes.has(p.toLowerCase())) return p.toLowerCase();
        }
        return parts[0] ? parts[0].toLowerCase() : '_misc';
      }

      /* Issue #1: Infer database type from evidence/services */
      function inferDbType(api) {
        const evidence = (api.tableAccess || []).flatMap(ta => ta.evidence || []).join(' ').toLowerCase();
        const services = (api.services || []).join(' ').toLowerCase();
        const combined = evidence + ' ' + services;
        if (/mongoose|\.findone|\.findbyid|\.find\(|\.save\(|model\.|mongodb/.test(combined)) return 'MongoDB';
        if (/prisma\.|@prisma/.test(combined)) return 'Prisma';
        if (/sequelize|datatypes/.test(combined)) return 'Sequelize';
        if (/knex|pg\b|postgresql|pool\.query/.test(combined)) return 'PostgreSQL';
        if (/redis/.test(combined)) return 'Redis';
        if (api.tables && api.tables.length > 0) return 'DB';
        return null;
      }

      /* Get table-level details for right panel */
      function getTableDetails(api) {
        const dbType = inferDbType(api);
        const taMap = new Map();
        (api.tableAccess || []).forEach(ta => {
          if (!ta.table) return;
          const key = ta.table.toLowerCase();
          if (!taMap.has(key)) taMap.set(key, { table: ta.table, columns: new Set(), operations: new Set(), evidence: [] });
          const e = taMap.get(key);
          (ta.columns || []).forEach(c => e.columns.add(c));
          (ta.operations || []).forEach(o => e.operations.add(o));
          (ta.evidence || []).forEach(ev => { if (e.evidence.length < 2) e.evidence.push(ev); });
        });
        // Fallback: tables without tableAccess entries
        (api.tables || []).forEach(t => {
          const key = t.toLowerCase();
          if (!taMap.has(key)) taMap.set(key, { table: t, columns: new Set(['*']), operations: new Set(['UNKNOWN']), evidence: [] });
        });
        return { dbType, entries: [...taMap.values()].map(e => ({ ...e, columns: [...e.columns], operations: [...e.operations] })) };
      }

      function normalizeTableAccessEntries(raw) {
        if (!Array.isArray(raw)) return [];
        return raw.filter(item => item && item.table).map(item => ({
          table: String(item.table),
          columns: dedupeStrings(Array.isArray(item.columns) ? item.columns : []),
          operations: dedupeStrings(Array.isArray(item.operations) ? item.operations : []),
          evidence: dedupeStrings(Array.isArray(item.evidence) ? item.evidence : [])
        }));
      }

      function localTableAccess(api) {
        const ta = normalizeTableAccessEntries(api.tableAccess);
        if (ta.length) return ta;
        return dedupeStrings(api.tables).map(t => ({ table: t, columns: ['*'], operations: ['UNKNOWN'], evidence: [] }));
      }

      function impactVerb(ops) {
        const s = new Set((ops || []).map(v => String(v || '').toUpperCase()));
        const r = s.has('SELECT'), w = s.has('INSERT') || s.has('UPDATE') || s.has('DELETE') || s.has('UPSERT');
        if (r && w) return 'reads and writes';
        if (r) return 'reads';
        if (w) return 'writes';
        return 'touches';
      }

      function impactHow(verb, table, column, match) {
        const p = verb.charAt(0).toUpperCase() + verb.slice(1);
        if (!column) return p + ' table ' + table;
        if (match === 'explicit') return p + ' column ' + column + ' in table ' + table;
        if (match === 'wildcard') return p + ' table ' + table + ' via wildcard access; ' + column + ' may be impacted';
        return p + ' table ' + table + '; column impact inferred from table-level metadata';
      }

      function buildLocalImpactPayload(apis, filters) {
        const tf = String(filters.table || '').trim();
        const cf = String(filters.column || '').trim();
        const tfk = tf.toLowerCase(), cfk = cf.toLowerCase();
        const tMap = new Map(), results = [];
        for (const api of apis || []) {
          const access = localTableAccess(api);
          for (const e of access) {
            const k = e.table.toLowerCase();
            if (!tMap.has(k)) tMap.set(k, { table: e.table, columns: new Set(), apiIds: new Set() });
            const m = tMap.get(k);
            m.apiIds.add(api.method + ' ' + api.path);
            for (const c of e.columns) m.columns.add(c);
          }
        }
        if (tf) {
          for (const api of apis || []) {
            const access = localTableAccess(api).filter(e => e.table.toLowerCase() === tfk);
            if (!access.length) continue;
            const ops = new Set(), cols = new Set(), ev = [];
            let match = 'table', matched = false;
            for (const e of access) {
              const ck = new Set((e.columns || []).map(v => v.toLowerCase()));
              if (cfk) {
                if (ck.has(cfk)) match = 'explicit';
                else if (ck.has('*')) { if (match !== 'explicit') match = 'wildcard'; }
                else if (!e.columns || !e.columns.length) { if (match === 'table') match = 'inferred-table'; }
                else continue;
              }
              matched = true;
              for (const o of e.operations || []) ops.add(o);
              for (const c of e.columns || []) cols.add(c);
              for (const h of e.evidence || []) { if (ev.length < 2) ev.push(h); }
            }
            if (!matched) continue;
            const method = String(api.method || '').toUpperCase();
            const path = String(api.path || '');
            const verb = impactVerb([...ops]);
            results.push({
              method, path, summary: api.summary || method + ' ' + path,
              table: tf, operations: [...ops], columns: [...cols],
              columnMatch: cfk ? match : 'table', impact: verb,
              how: impactHow(verb, tf, cf, match),
              flowMatches: (api.flow || []).filter(s => {
                const t = String(s || '').toLowerCase();
                return t.includes(tfk) || (cfk ? t.includes(cfk) : false);
              }),
              evidence: ev
            });
          }
        }
        return {
          totalApis: (apis || []).length,
          tables: [...tMap.values()].map(e => ({
            table: e.table,
            columns: [...e.columns].sort((a, b) => a === '*' ? -1 : b === '*' ? 1 : a.localeCompare(b)),
            apiCount: e.apiIds.size
          })).sort((a, b) => a.table.localeCompare(b.table)),
          filters: { table: tf, column: cf },
          results: results.sort((a, b) => (a.method + ' ' + a.path).localeCompare(b.method + ' ' + b.path))
        };
      }

      function buildLocalDependencyCatalog(apis) {
        const map = new Map();
        for (const api of apis || []) {
          const id = api.method + ' ' + api.path;
          for (const dep of api.dependencies || []) {
            const k = dep.toLowerCase();
            if (!map.has(k)) map.set(k, { dependency: dep, apiIds: new Set() });
            map.get(k).apiIds.add(id);
          }
        }
        return [...map.values()].map(e => ({ dependency: e.dependency, apiCount: e.apiIds.size }))
          .sort((a, b) => (a.dependency < b.dependency ? -1 : a.dependency > b.dependency ? 1 : 0));
      }

      function buildLocalServiceCatalog(apis) {
        const map = new Map();
        for (const api of apis || []) {
          const id = api.method + ' ' + api.path;
          for (const svc of api.services || []) {
            const k = svc.toLowerCase();
            if (!map.has(k)) map.set(k, { service: svc, apiIds: new Set() });
            map.get(k).apiIds.add(id);
          }
        }
        return [...map.values()].map(e => ({ service: e.service, apiCount: e.apiIds.size }))
          .sort((a, b) => (a.service < b.service ? -1 : a.service > b.service ? 1 : 0));
      }

      function columnMatchLabel(v) {
        if (v === 'explicit') return 'Explicit column mapping';
        if (v === 'wildcard') return 'Wildcard query mapping';
        if (v === 'inferred-table') return 'Inferred from table-level metadata';
        return 'Table-level mapping';
      }

      function normalizeApis(raw) {
        const list = Array.isArray(raw) ? raw : [], deduped = [], seen = new Set();
        for (const item of list) {
          if (!item || !item.method || !item.path) continue;
          const method = String(item.method).toUpperCase();
          const key = method + ' ' + item.path;
          if (seen.has(key)) continue;
          seen.add(key);
          deduped.push({
            method, path: item.path,
            summary: item.summary || (method + ' ' + item.path + ' endpoint'),
            flow: Array.isArray(item.flow) ? item.flow : [],
            tables: dedupeStrings(Array.isArray(item.tables) ? item.tables : []),
            services: dedupeStrings(Array.isArray(item.services) ? item.services : []),
            dependencies: dedupeStrings(Array.isArray(item.dependencies) ? item.dependencies : []),
            caches: dedupeStrings(Array.isArray(item.caches) ? item.caches : []),
            queues: dedupeStrings(Array.isArray(item.queues) ? item.queues : []),
            tableAccess: normalizeTableAccessEntries(item.tableAccess)
          });
        }
        return deduped;
      }

      function truncate(text, size) {
        const v = String(text || '');
        return v.length <= size ? v : v.slice(0, size - 1) + '...';
      }

      function stableHash(text) {
        let h = 2166136261;
        const v = String(text || '');
        for (let i = 0; i < v.length; i++) { h ^= v.charCodeAt(i); h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24); }
        return h >>> 0;
      }

      function mulberry32(seed) {
        return function() {
          let t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function SvgIcon({ d, size = 16, color = 'currentColor' }) {
        return React.createElement('svg', {
          width: size, height: size, viewBox: '0 0 24 24',
          fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round'
        }, React.createElement('path', { d }));
      }

      /* ---- Bubble Graph Component (D3) ---- */
      function BubbleGraph({ apis, selectedId, onSelectApi, onHoverApi }) {
        const svgRef = useRef(null);
        const simRef = useRef(null);

        useEffect(() => {
          if (!svgRef.current || !apis.length) return;
          const svg = d3.select(svgRef.current);
          const container = svgRef.current.parentElement;
          const width = container.clientWidth, height = container.clientHeight;
          svg.attr('viewBox', '0 0 ' + width + ' ' + height);
          svg.selectAll('*').remove();

          const defs = svg.append('defs');
          const filter = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
          filter.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'coloredBlur');
          const feMerge = filter.append('feMerge');
          feMerge.append('feMergeNode').attr('in', 'coloredBlur');
          feMerge.append('feMergeNode').attr('in', 'SourceGraphic');
          const filterHover = defs.append('filter').attr('id', 'glow-hover').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
          filterHover.append('feGaussianBlur').attr('stdDeviation', '8').attr('result', 'coloredBlur');
          const feMerge2 = filterHover.append('feMerge');
          feMerge2.append('feMergeNode').attr('in', 'coloredBlur');
          feMerge2.append('feMergeNode').attr('in', 'SourceGraphic');

          const tableGroups = {};
          apis.forEach(api => {
            const key = getApiGroup(api);
            if (!tableGroups[key]) tableGroups[key] = [];
            tableGroups[key].push(api);
          });
          const groupKeys = Object.keys(tableGroups);
          const groupCenters = {};
          /* Spread groups evenly, using more of the canvas so clusters don't overlap */
          const spreadRadius = Math.min(width, height) * 0.33;
          groupKeys.forEach((key, i) => {
            /* Offset angle by -π/2 so first group starts at top */
            const angle = (2 * Math.PI * i) / Math.max(groupKeys.length, 1) - Math.PI / 2;
            groupCenters[key] = {
              x: width / 2 + Math.cos(angle) * spreadRadius,
              y: height / 2 + Math.sin(angle) * spreadRadius
            };
          });

          const resourceCount = api => (api.tables ? api.tables.length : 0) + (api.services ? api.services.length : 0) + (api.caches ? api.caches.length : 0) + (api.queues ? api.queues.length : 0);
          const maxRes = Math.max(1, ...apis.map(resourceCount));

          const nodes = apis.map(api => {
            const key = getApiGroup(api);
            const r = 18 + (resourceCount(api) / maxRes) * 22;
            const rng = mulberry32(stableHash(api.method + api.path));
            return {
              id: api.method + ' ' + api.path, api, r,
              color: methodColor(api.method), glow: methodGlow(api.method),
              groupKey: key, fx: null, fy: null,
              x: groupCenters[key].x + (rng() - 0.5) * 60,
              y: groupCenters[key].y + (rng() - 0.5) * 60,
              floatPhase: rng() * Math.PI * 2, floatAmp: 1.5 + rng() * 2.5
            };
          });

          /* Only link APIs within the same domain group — cross-group links (e.g. all sharing
             the 'users' auth table) would collapse every group into one blob */
          const links = [];
          for (let i = 0; i < apis.length; i++) {
            for (let j = i + 1; j < apis.length; j++) {
              if (nodes[i].groupKey !== nodes[j].groupKey) continue;
              const tablesI = new Set(apis[i].tables || []);
              const shared = (apis[j].tables || []).filter(t => tablesI.has(t));
              if (shared.length) links.push({ source: nodes[i], target: nodes[j], strength: shared.length });
            }
          }

          const sim = d3.forceSimulation(nodes)
            /* Weak local repulsion — group forces do the real positioning */
            .force('charge', d3.forceManyBody().strength(-40))
            /* No forceCenter — it fights the group x/y forces */
            .force('collision', d3.forceCollide().radius(d => d.r + 10))
            .force('link', d3.forceLink(links).id(d => d.id).distance(60).strength(0.3))
            /* Strong group anchoring — pulls each bubble firmly to its domain cluster */
            .force('x', d3.forceX().x(d => groupCenters[d.groupKey].x).strength(0.28))
            .force('y', d3.forceY().y(d => groupCenters[d.groupKey].y).strength(0.28))
            .alphaDecay(0.018);
          simRef.current = sim;

          const g = svg.append('g');
          const gridG = g.append('g');
          for (let x = 0; x < width; x += 40) {
            for (let y = 0; y < height; y += 40) {
              gridG.append('circle').attr('cx', x).attr('cy', y).attr('r', 0.5).attr('fill', 'rgba(79,124,255,0.08)');
            }
          }

          const linkG = g.append('g');
          const linkEls = linkG.selectAll('line').data(links).enter().append('line')
            .attr('stroke', 'rgba(79,124,255,0.12)').attr('stroke-width', d => 0.5 + d.strength * 0.5);

          const bubbleG = g.append('g');
          const bubbles = bubbleG.selectAll('g').data(nodes).enter().append('g')
            .attr('cursor', 'pointer')
            .on('click', (event, d) => { onSelectApi(d.api, false); })
            .on('mouseenter', (event, d) => {
              d3.select(event.currentTarget).select('.bubble-outer').attr('filter', 'url(#glow-hover)');
              onHoverApi(d.api, event.pageX, event.pageY);
            })
            .on('mouseleave', (event, d) => {
              d3.select(event.currentTarget).select('.bubble-outer').attr('filter', 'url(#glow)');
              onHoverApi(null);
            });

          bubbles.append('circle').attr('class', 'bubble-outer').attr('r', d => d.r).attr('fill', d => d.glow).attr('filter', 'url(#glow)');
          bubbles.append('circle').attr('r', d => d.r - 3).attr('fill', 'rgba(10,14,26,0.8)').attr('stroke', d => d.color).attr('stroke-width', 1.5);

          /* Method label */
          bubbles.append('text')
            .attr('text-anchor', 'middle')
            .attr('dy', d => d.r > 28 ? -4 : 0)
            .attr('fill', d => d.color)
            .attr('font-size', d => d.r > 28 ? 9 : 8)
            .attr('font-weight', 800).attr('letter-spacing', '0.04em')
            .text(d => d.api.method);

          /* Path label for larger bubbles */
          bubbles.filter(d => d.r > 22).append('text')
            .attr('text-anchor', 'middle').attr('dy', d => d.r > 28 ? 7 : 8)
            .attr('fill', 'rgba(232,237,245,0.7)').attr('font-size', 7)
            .text(d => { const p = d.api.path; return p.length > 18 ? p.slice(0, 17) + '..' : p; });

          /* Issue #4: Show description snippet for all bubbles large enough */
          bubbles.filter(d => d.r > 30 && d.api.summary && d.api.summary.length > 0).append('text')
            .attr('text-anchor', 'middle').attr('dy', 18)
            .attr('fill', 'rgba(232,237,245,0.4)').attr('font-size', 6)
            .text(d => { const s = d.api.summary || ''; return s.length > 24 ? s.slice(0, 23) + '..' : s; });

          /* Group title labels — appended to SVG directly (top layer, above all bubbles) */
          const LABEL_W = 100, LABEL_H = 24;
          const groupLabelItems = {};
          groupKeys.forEach(key => {
            if (key === '_misc') return;
            const count = tableGroups[key].length;
            const labelG = svg.append('g').attr('pointer-events', 'none');
            labelG.append('rect')
              .attr('width', LABEL_W).attr('height', LABEL_H).attr('rx', 12)
              .attr('fill', 'rgba(10,14,26,0.9)')
              .attr('stroke', 'rgba(79,124,255,0.4)').attr('stroke-width', 1);
            labelG.append('text')
              .attr('x', LABEL_W / 2).attr('y', 16)
              .attr('text-anchor', 'middle')
              .attr('font-size', 10).attr('font-weight', 700)
              .attr('letter-spacing', '0.1em')
              .attr('fill', '#e8edf5')
              .text(key.toUpperCase() + ' · ' + count);
            groupLabelItems[key] = labelG;
          });

          let animFrame;
          const startTime = Date.now();
          function animate() {
            const t = (Date.now() - startTime) / 1000;
            bubbles.attr('transform', d => {
              const floatY = Math.sin(t * 0.6 + d.floatPhase) * d.floatAmp;
              return 'translate(' + d.x + ',' + (d.y + floatY) + ')';
            });
            linkEls.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);

            /* Update each group label to sit just above its cluster's topmost bubble */
            groupKeys.forEach(key => {
              if (key === '_misc' || !groupLabelItems[key]) return;
              const groupNodes = nodes.filter(n => n.groupKey === key);
              if (!groupNodes.length) return;
              let minY = Infinity, sumX = 0;
              groupNodes.forEach(n => {
                const top = n.y - n.r;
                if (top < minY) minY = top;
                sumX += n.x;
              });
              const cx = sumX / groupNodes.length;
              const labelX = Math.max(4, Math.min(width - LABEL_W - 4, cx - LABEL_W / 2));
              const labelY = Math.max(4, minY - LABEL_H - 8);
              groupLabelItems[key].attr('transform', 'translate(' + labelX + ',' + labelY + ')');
            });

            animFrame = requestAnimationFrame(animate);
          }
          sim.on('tick', () => {
            nodes.forEach(d => {
              d.x = Math.max(d.r + 10, Math.min(width - d.r - 10, d.x));
              d.y = Math.max(d.r + 10, Math.min(height - d.r - 10, d.y));
            });
          });
          animate();
          return () => { cancelAnimationFrame(animFrame); sim.stop(); };
        }, [apis]);

        useEffect(() => {
          if (!svgRef.current) return;
          d3.select(svgRef.current).selectAll('.bubble-outer')
            .attr('stroke', function(d) { return d && d.id === selectedId ? d.color : 'none'; })
            .attr('stroke-width', function(d) { return d && d.id === selectedId ? 2 : 0; });
        }, [selectedId]);

        return React.createElement('svg', { ref: svgRef, className: 'canvas-svg' });
      }

      /* ---- Find which flow step a resource is linked to (Issue #7) ---- */
      function findStepForResource(resourceLabel, flowSteps) {
        const label = resourceLabel.toLowerCase();
        const parts = label.split(/[\s_\-\.\/]+/).filter(p => p.length > 2);
        for (let i = 0; i < flowSteps.length; i++) {
          const step = (flowSteps[i] || '').toLowerCase();
          if (parts.some(p => step.includes(p)) || step.includes(label)) return i;
        }
        return -1;
      }

      /* ---- Flow Overlay Component (Issues #7 & #8) ---- */
      function FlowOverlay({ api, onClose }) {
        const svgRef = useRef(null);
        const [selectedNode, setSelectedNode] = useState(null);

        useEffect(() => {
          if (!svgRef.current || !api) return;
          const svg = d3.select(svgRef.current);
          svg.selectAll('*').remove();

          const flowSteps = api.flow || [];
          const resources = [];
          (api.tables || []).forEach(t => {
            const ta = (api.tableAccess || []).find(x => x.table === t);
            resources.push({ type: 'database', label: t, color: '#00d4b1', ta: ta || null });
          });
          (api.services || []).forEach(s => resources.push({ type: 'service', label: s, color: '#4f7cff', ta: null }));
          (api.caches || []).forEach(c => resources.push({ type: 'cache', label: c, color: '#a78bfa', ta: null }));
          (api.queues || []).forEach(q => resources.push({ type: 'queue', label: q, color: '#ffb340', ta: null }));

          /* Issue #7: Tag each resource to its linked flow step */
          resources.forEach(r => { r.linkedStep = findStepForResource(r.label, flowSteps); });

          const stepWidth = 150, stepHeight = 52, stepGap = 50;
          const apiNodeX = 80, apiNodeY = 220;
          const startX = 220;
          const totalFlowWidth = startX + flowSteps.length * (stepWidth + stepGap) + 60;
          const totalWidth = Math.max(900, totalFlowWidth + 100);
          const totalHeight = 460;
          const centerY = 220;

          svg.attr('viewBox', '0 0 ' + totalWidth + ' ' + totalHeight)
             .attr('width', totalWidth).attr('height', totalHeight);

          const defs = svg.append('defs');
          const glowF = defs.append('filter').attr('id', 'fglow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
          glowF.append('feGaussianBlur').attr('stdDeviation', '5').attr('result', 'blur');
          const fm = glowF.append('feMerge');
          fm.append('feMergeNode').attr('in', 'blur');
          fm.append('feMergeNode').attr('in', 'SourceGraphic');

          /* Grid */
          for (let x = 0; x < totalWidth; x += 30) {
            for (let y = 0; y < totalHeight; y += 30) {
              svg.append('circle').attr('cx', x).attr('cy', y).attr('r', 0.4).attr('fill', 'rgba(79,124,255,0.04)');
            }
          }

          /* Step positions */
          const stepPositions = flowSteps.map((step, i) => ({
            x: startX + i * (stepWidth + stepGap),
            y: centerY + (i % 2 === 0 ? -60 : 60),
            step, i
          }));

          /* API center node */
          const apiColor = methodColor(api.method);
          const apiG = svg.append('g').attr('transform', 'translate(' + apiNodeX + ',' + centerY + ')').style('opacity', 0);
          apiG.append('rect').attr('x', -55).attr('y', -28).attr('width', 110).attr('height', 56)
            .attr('rx', 10).attr('fill', 'rgba(10,14,26,0.9)').attr('stroke', apiColor).attr('stroke-width', 2).attr('filter', 'url(#fglow)');
          apiG.append('text').attr('text-anchor', 'middle').attr('y', -6).attr('fill', apiColor).attr('font-size', 11).attr('font-weight', 800).text(api.method);
          apiG.append('text').attr('text-anchor', 'middle').attr('y', 12).attr('fill', 'rgba(232,237,245,0.8)').attr('font-size', 8)
            .text(api.path.length > 18 ? api.path.slice(0, 17) + '..' : api.path);
          apiG.transition().delay(100).duration(400).style('opacity', 1);

          /* Flow step nodes */
          const stepGs = [];
          stepPositions.forEach((pos, i) => {
            const prevX = i === 0 ? apiNodeX + 55 : stepPositions[i-1].x + stepWidth;
            const prevY = i === 0 ? centerY : stepPositions[i-1].y;
            const edge = svg.append('path')
              .attr('d', 'M' + prevX + ',' + prevY + ' C' + (prevX + 40) + ',' + prevY + ' ' + (pos.x - 20) + ',' + pos.y + ' ' + pos.x + ',' + pos.y)
              .attr('fill', 'none').attr('stroke', 'rgba(79,124,255,0.35)').attr('stroke-width', 1.5)
              .attr('stroke-dasharray', '200').attr('stroke-dashoffset', '200');
            edge.transition().delay(300 + i * 180).duration(500).attr('stroke-dashoffset', '0')
              .on('end', function() { d3.select(this).attr('stroke-dasharray', '8, 6').attr('stroke-dashoffset', '0').classed('flow-edge-animated', true); });

            const stepG = svg.append('g').attr('transform', 'translate(' + pos.x + ',' + pos.y + ')').style('opacity', 0).attr('cursor', 'pointer');
            stepGs.push({ g: stepG, pos, step: pos.step, i });

            stepG.append('rect').attr('x', 0).attr('y', -stepHeight/2).attr('width', stepWidth).attr('height', stepHeight)
              .attr('rx', 8).attr('fill', 'rgba(16,22,40,0.9)').attr('stroke', 'rgba(79,124,255,0.3)').attr('stroke-width', 1);
            stepG.append('text').attr('x', stepWidth/2).attr('y', -stepHeight/2 + 13).attr('text-anchor', 'middle')
              .attr('fill', '#4f7cff').attr('font-size', 8).attr('font-weight', 700).text('Step ' + (i+1));

            /* Wrap step text */
            const words = pos.step.split(' ');
            let line = '', lineY = -stepHeight/2 + 26;
            words.forEach(w => {
              const test = line + (line ? ' ' : '') + w;
              if (test.length > 24 && line) {
                stepG.append('text').attr('x', stepWidth/2).attr('y', lineY).attr('text-anchor', 'middle')
                  .attr('fill', 'rgba(232,237,245,0.6)').attr('font-size', 7.5).text(line);
                lineY += 10; line = w;
              } else { line = test; }
            });
            if (line) stepG.append('text').attr('x', stepWidth/2).attr('y', lineY).attr('text-anchor', 'middle')
              .attr('fill', 'rgba(232,237,245,0.6)').attr('font-size', 7.5).text(line);

            /* Issue #8: clickable step node */
            stepG.on('click', () => {
              setSelectedNode({ type: 'step', label: 'Step ' + (i+1), step: pos.step, index: i, api });
            });
            stepG.on('mouseenter', function() { d3.select(this).select('rect').attr('stroke', 'rgba(79,124,255,0.7)').attr('fill', 'rgba(79,124,255,0.08)'); });
            stepG.on('mouseleave', function() { d3.select(this).select('rect').attr('stroke', 'rgba(79,124,255,0.3)').attr('fill', 'rgba(16,22,40,0.9)'); });

            stepG.transition().delay(400 + i * 180).duration(350).style('opacity', 1);
          });

          /* Issue #7: Resource nodes positioned near their linked step */
          const unlinkedResIdx = [];
          const linkedResCountPerStep = {};

          resources.forEach((res, ri) => {
            if (res.linkedStep >= 0 && res.linkedStep < stepPositions.length) {
              if (!linkedResCountPerStep[res.linkedStep]) linkedResCountPerStep[res.linkedStep] = 0;
              linkedResCountPerStep[res.linkedStep]++;
            } else {
              unlinkedResIdx.push(ri);
            }
          });

          /* Track how many resources have been placed per step (for offset) */
          const placedPerStep = {};

          resources.forEach((res, ri) => {
            let rx, ry, fromX, fromY;

            if (res.linkedStep >= 0 && res.linkedStep < stepPositions.length) {
              const pos = stepPositions[res.linkedStep];
              if (!placedPerStep[res.linkedStep]) placedPerStep[res.linkedStep] = 0;
              const offset = placedPerStep[res.linkedStep];
              placedPerStep[res.linkedStep]++;
              /* Place resource above or below the step */
              const goBelow = pos.y < centerY; // step is above center → place resource below
              ry = goBelow ? pos.y + stepHeight/2 + 80 + offset * 70 : pos.y - stepHeight/2 - 80 - offset * 70;
              rx = pos.x + stepWidth/2;
              fromX = pos.x + stepWidth/2;
              fromY = goBelow ? pos.y + stepHeight/2 : pos.y - stepHeight/2;
            } else {
              /* Unlinked: append to the right of the last step */
              const unlinkedIdx = unlinkedResIdx.indexOf(ri);
              const lastX = stepPositions.length > 0 ? stepPositions[stepPositions.length-1].x + stepWidth + 60 : startX + 60;
              rx = lastX + unlinkedIdx * 150;
              ry = centerY + (unlinkedIdx % 2 === 0 ? -70 : 70);
              fromX = stepPositions.length > 0 ? stepPositions[stepPositions.length-1].x + stepWidth : apiNodeX + 55;
              fromY = stepPositions.length > 0 ? stepPositions[stepPositions.length-1].y : centerY;
            }

            /* Edge from step to resource */
            const resEdge = svg.append('line')
              .attr('x1', fromX).attr('y1', fromY).attr('x2', rx).attr('y2', ry)
              .attr('stroke', res.color + '55').attr('stroke-width', 1).attr('stroke-dasharray', '4,4').style('opacity', 0);
            resEdge.transition().delay(600 + ri * 120).duration(350).style('opacity', 1);

            const resG = svg.append('g').attr('transform', 'translate(' + rx + ',' + ry + ')').style('opacity', 0).attr('cursor', 'pointer');

            if (res.type === 'database') {
              /* Cylinder */
              resG.append('ellipse').attr('rx', 26).attr('ry', 7).attr('cy', -14).attr('fill', 'rgba(10,14,26,0.9)').attr('stroke', res.color).attr('stroke-width', 1.5);
              resG.append('rect').attr('x', -26).attr('y', -14).attr('width', 52).attr('height', 26).attr('fill', 'rgba(10,14,26,0.9)');
              resG.append('ellipse').attr('rx', 26).attr('ry', 7).attr('cy', 12).attr('fill', 'rgba(10,14,26,0.9)').attr('stroke', res.color).attr('stroke-width', 1.5);
              resG.append('line').attr('x1', -26).attr('y1', -14).attr('x2', -26).attr('y2', 12).attr('stroke', res.color).attr('stroke-width', 1.5);
              resG.append('line').attr('x1', 26).attr('y1', -14).attr('x2', 26).attr('y2', 12).attr('stroke', res.color).attr('stroke-width', 1.5);
            } else if (res.type === 'cache') {
              resG.append('rect').attr('x', -22).attr('y', -18).attr('width', 44).attr('height', 36)
                .attr('rx', 4).attr('fill', 'rgba(10,14,26,0.9)').attr('stroke', res.color).attr('stroke-width', 1.5);
              resG.append('line').attr('x1', -22).attr('y1', -6).attr('x2', 22).attr('y2', -6).attr('stroke', res.color + '88').attr('stroke-width', 1);
            } else {
              const hex = 'M0,-20 L17,-10 L17,10 L0,20 L-17,10 L-17,-10 Z';
              resG.append('path').attr('d', hex).attr('fill', 'rgba(10,14,26,0.9)').attr('stroke', res.color).attr('stroke-width', 1.5);
            }

            resG.append('text').attr('text-anchor', 'middle').attr('y', 30)
              .attr('fill', res.color).attr('font-size', 8).attr('font-weight', 700).text(res.type.toUpperCase());
            resG.append('text').attr('text-anchor', 'middle').attr('y', 42)
              .attr('fill', 'rgba(232,237,245,0.65)').attr('font-size', 7.5)
              .text(res.label.length > 18 ? res.label.slice(0, 17) + '..' : res.label);

            resG.attr('filter', 'url(#fglow)');

            /* Issue #8: clickable resource node */
            resG.on('click', () => {
              setSelectedNode({ type: res.type, label: res.label, color: res.color, ta: res.ta, api });
            });
            resG.on('mouseenter', function() { d3.select(this).selectAll('ellipse,rect,path').attr('stroke-width', 2.5); });
            resG.on('mouseleave', function() { d3.select(this).selectAll('ellipse,rect,path').attr('stroke-width', 1.5); });

            resG.transition().delay(650 + ri * 120).duration(350).style('opacity', 1);
          });

        }, [api]);

        if (!api) return null;

        const h = React.createElement;

        /* Issue #8: Right detail panel for clicked node */
        const detailPanel = selectedNode ? h('div', { className: 'flow-detail-panel', key: 'detail' }, [
          h('div', { className: 'flow-detail-header', key: 'header' }, [
            h('h4', { key: 't' }, selectedNode.type === 'step' ? selectedNode.label : selectedNode.label),
            h('button', { className: 'flow-detail-close', key: 'close', onClick: () => setSelectedNode(null) }, '×')
          ]),
          h('div', { className: 'flow-detail-body', key: 'body' }, [
            /* Type badge */
            h('div', {
              key: 'badge',
              className: 'flow-detail-type-badge',
              style: {
                background: selectedNode.type === 'step' ? 'rgba(79,124,255,0.15)' : (selectedNode.color || '#4f7cff') + '22',
                color: selectedNode.type === 'step' ? '#4f7cff' : (selectedNode.color || '#4f7cff')
              }
            }, selectedNode.type.toUpperCase()),

            /* Label */
            h('div', { className: 'flow-detail-label', key: 'label' },
              selectedNode.type === 'step' ? selectedNode.step : selectedNode.label
            ),

            /* Step-specific details */
            selectedNode.type === 'step' ? h(React.Fragment, { key: 'step-details' }, [
              h('div', { className: 'flow-detail-row', key: 'step-num' }, [
                h('div', { className: 'flow-detail-row-label', key: 'l' }, 'Step Number'),
                h('div', { className: 'flow-detail-row-value', key: 'v' }, 'Step ' + (selectedNode.index + 1) + ' of ' + (api.flow || []).length)
              ]),
              h('div', { className: 'flow-detail-row', key: 'description' }, [
                h('div', { className: 'flow-detail-row-label', key: 'l' }, 'Description'),
                h('div', { className: 'flow-detail-row-value', key: 'v' }, selectedNode.step)
              ]),
              /* Show tables referenced in this step */
              (() => {
                const stepLower = (selectedNode.step || '').toLowerCase();
                const refTables = (api.tables || []).filter(t => stepLower.includes(t.toLowerCase()));
                if (!refTables.length) return null;
                return h('div', { className: 'flow-detail-row', key: 'ref-tables' }, [
                  h('div', { className: 'flow-detail-row-label', key: 'l' }, 'Referenced Tables'),
                  h('div', { key: 'v' }, refTables.map(t => h('span', { className: 'flow-detail-chip', key: t, style: { borderColor: 'rgba(0,212,177,0.3)', color: '#00d4b1' } }, t)))
                ]);
              })()
            ]) : null,

            /* Database node details */
            selectedNode.type === 'database' ? h(React.Fragment, { key: 'db-details' }, [
              h('div', { className: 'flow-detail-row', key: 'table-name' }, [
                h('div', { className: 'flow-detail-row-label', key: 'l' }, 'Collection / Table'),
                h('div', { className: 'flow-detail-row-value', key: 'v', style: { color: '#00d4b1', fontWeight: 700 } }, selectedNode.label)
              ]),
              selectedNode.ta ? h(React.Fragment, { key: 'ta-details' }, [
                selectedNode.ta.operations && selectedNode.ta.operations.length > 0 ?
                  h('div', { className: 'flow-detail-row', key: 'ops' }, [
                    h('div', { className: 'flow-detail-row-label', key: 'l' }, 'Operations'),
                    h('div', { key: 'v' }, (selectedNode.ta.operations || []).map(op =>
                      h('span', { className: 'flow-detail-chip', key: op, style: { borderColor: 'rgba(0,212,177,0.3)', color: '#00d4b1' } }, op)
                    ))
                  ]) : null,
                selectedNode.ta.columns && selectedNode.ta.columns.length > 0 ?
                  h('div', { className: 'flow-detail-row', key: 'cols' }, [

        const sc = scoreColor(f.coverageScore);

        const sections = [
          /* Header */
          h('div', { className: 'scanner-detail-section', key: 'file-hdr' }, [

              h('span', { className: 'section-dot', key: 'd', style: { background: sc } }),

              h('span', { key: 'lines', style: { fontSize: 9, color: 'var(--text-muted)' } }, f.lines + ' lines'),

          /* Coverage score */
          h('div', { className: 'scanner-detail-section', key: 'cov' }, [
            h('h4', { key: 'h' }, [h('span', { className: 'section-dot', key: 'd', style: { background: sc } }), 'Coverage Score']),
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 }, key: 'row' }, [
              h('span', { style: { fontSize: 28, fontWeight: 800, color: sc }, key: 'num' }, f.coverageScore + '%'),

        /* Routes */

          sections.push(

              ...f.routes.map((r, i) =>
                h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 } }, [
                  h('span', { className: 'method-badge mb-' + (r.method || '').toLowerCase(), key: 'm' }, r.method || '?'),
                  h('span', { style: { fontSize: 10, color: 'var(--text-secondary)', fontFamily: 'monospace' }, key: 'p' }, r.path),
                  h('span', { style: { fontSize: 8, color: 'var(--text-muted)', marginLeft: 'auto' }, key: 'fw' }, r.framework)

        /* SQL */
        if (f.sqlInfo && (f.sqlInfo.fragmentCount > 0 || f.sqlInfo.tables.length > 0)) {
          sections.push(
            h('div', { className: 'scanner-detail-section', key: 'sql' }, [
              h('h4', { key: 'h' }, [h('span', { className: 'section-dot', key: 'd', style: { background: '#00d4b1' } }), 'SQL / Tables']),
              h('div', { style: { fontSize: 10, color: 'var(--text-muted)', marginBottom: 4 }, key: 'frags' }, f.sqlInfo.fragmentCount + ' SQL fragment(s) · ops: ' + (f.sqlInfo.operations.join(', ') || '—')),
              f.sqlInfo.tables.length > 0
                ? h('div', { key: 'tables', style: { display: 'flex', flexWrap: 'wrap', gap: 3 } },
                    f.sqlInfo.tables.map(t => h('span', { className: 'db-col-chip', key: t }, t))

        /* ORM */
        if (f.ormUsage && Object.keys(f.ormUsage).length > 0) {
          sections.push(
            h('div', { className: 'scanner-detail-section', key: 'orm' }, [
              h('h4', { key: 'h' }, [h('span', { className: 'section-dot', key: 'd', style: { background: '#00d4b1' } }), 'ORM Usage']),
              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 4 }, key: 'chips' },
                Object.entries(f.ormUsage).map(([orm, count]) =>
                  h('span', { key: orm, style: { fontSize: 10, padding: '2px 7px', borderRadius: 4, background: 'rgba(0,212,177,0.1)', color: '#00d4b1', border: '1px solid rgba(0,212,177,0.25)' } },

                )

        if (f.httpCallCount > 0) {

              h('h4', { key: 'h' }, [h('span', { className: 'section-dot', key: 'd', style: { background: '#4f7cff' } }), 'Outbound HTTP Calls']),

              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 4 }, key: 'q' },

              )
            ])

        }

        /* Imports */
        if (f.imports && f.imports.length > 0) {
          sections.push(
            h('div', { className: 'scanner-detail-section', key: 'imports' }, [

              h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 3 }, key: 'pkgs' },
                f.imports.slice(0, 30).map(pkg =>
                  h('span', { key: pkg, style: { fontSize: 9, padding: '1px 5px', borderRadius: 3, background: 'rgba(136,146,168,0.08)', color: '#8892a8', border: '1px solid rgba(136,146,168,0.18)', fontFamily: 'monospace' } }, pkg)

        return h(React.Fragment, {}, sections);

      /* ════════════════════════════════════════════════════════════
         SETUP WIZARD COMPONENT
         Three steps:
           1. Choose project (existing repo or new directory)
           2. Parse & AI enrichment
           3. Launch — show results summary
      ════════════════════════════════════════════════════════════ */
      function SetupWizard({ onComplete, onSwitchRepo, rescanRepo }) {
        const h = React.createElement;

        // ── Wizard state ──
        const [step, setStep] = useState(1);                // 1 | 2 | 3
        const [mode, setMode] = useState(null);             // 'existing' | 'new'
        const [selectedExisting, setSelectedExisting] = useState(null);
        const [newRepoPath, setNewRepoPath] = useState('');
        const [showDirBrowser, setShowDirBrowser] = useState(false);
        const [browserPath, setBrowserPath] = useState('');
        const [browserDirs, setBrowserDirs] = useState([]);
        const [browserSelected, setBrowserSelected] = useState('');
        const [knownRepos, setKnownRepos] = useState([]);
        const [dirInputValue, setDirInputValue] = useState('');
        const [dirSuggestions, setDirSuggestions] = useState([]);
        const [showDirSugg, setShowDirSugg] = useState(false);

        // ── Step 2 state ──
        const [parseStatus, setParseStatus] = useState('idle');    // idle | running | done | error
        const [parseProgress, setParseProgress] = useState({ percent: 0, index: 0, total: 0, file: '' });
        const [parseLogs, setParseLogs] = useState([]);
        const [parseDone, setParseDone] = useState(null);          // scan result
        const [parseError, setParseError] = useState('');
        const [aiState, setAiState] = useState('none');            // none | parser_only | prompt_ready | ai_enriched
        const [cmdCopied, setCmdCopied] = useState(false);
        const [promptGenerating, setPromptGenerating] = useState(false);  // true while /api/scan-prompt is running
        const [promptResult, setPromptResult] = useState(null);           // { fileCount, routeCount, instructionFile }

        // ── Step 3 state ──
        const [finalApis, setFinalApis] = useState([]);
        const [finalTables, setFinalTables] = useState(0);

        // ── Load known repos on mount ──
        useEffect(() => {
          fetch('/api/setup-status')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (data && Array.isArray(data.knownRepos)) setKnownRepos(data.knownRepos);
            })
            .catch(() => {});
        }, []);

        // ── Rescan mode: skip step 1, jump to step 2, force fresh parse ──
        useEffect(() => {
          if (!rescanRepo) return;
          setMode('existing');
          setSelectedExisting(rescanRepo);
          setStep(2);
          setAiState('none');
          setParseStatus('idle');
          setParseDone(null);
          setPromptResult(null);
          setPromptGenerating(false);
          startParse(rescanRepo);
        }, [rescanRepo]);

        // ── Directory browser ──
        async function loadBrowserDirs(p) {
          try {
            const res = await fetch('/api/dirs?path=' + encodeURIComponent(p || '/'));
            if (!res.ok) return;
            const data = await res.json();
            setBrowserDirs(data.dirs || []);
            setBrowserPath(data.current || p || '/');
          } catch { setBrowserDirs([]); }
        }

        function openBrowser() {
          const start = dirInputValue || newRepoPath || '/';
          setBrowserSelected('');
          setShowDirBrowser(true);
          loadBrowserDirs(start);
        }

        function browserNavigate(dir) {
          setBrowserSelected(dir);
          loadBrowserDirs(dir);
        }

        function browserGoUp() {
          const parts = browserPath.split('/').filter(Boolean);
          parts.pop();
          const parent = '/' + parts.join('/') || '/';
          loadBrowserDirs(parent);
        }

        function browserConfirm() {
          const chosen = browserSelected || browserPath;
          setNewRepoPath(chosen);
          setDirInputValue(chosen);
          setShowDirBrowser(false);
        }

        // ── Dir input autocomplete ──
        async function fetchDirSuggestions(p) {
          if (!p || p.length < 2) { setDirSuggestions([]); setShowDirSugg(false); return; }
          try {
            const res = await fetch('/api/dirs?path=' + encodeURIComponent(p));
            if (!res.ok) return;
            const data = await res.json();
            setDirSuggestions((data.dirs || []).slice(0, 6));
            setShowDirSugg((data.dirs || []).length > 0);
          } catch { setDirSuggestions([]); setShowDirSugg(false); }
        }

        function onDirInputChange(e) {
          const v = e.target.value;
          setDirInputValue(v);
          setNewRepoPath(v);
          fetchDirSuggestions(v);
        }

        function pickDirSugg(dir) {
          setDirInputValue(dir);
          setNewRepoPath(dir);
          setShowDirSugg(false);
          setDirSuggestions([]);
        }

        // ── Delete a repo from the registry ──
        async function deleteRepo(repoPath, e) {
          if (e) { e.stopPropagation(); e.preventDefault(); }
          if (!confirm('Remove "' + (repoPath.split('/').pop() || repoPath) + '" and delete its scan cache?')) return;
          try {
            const res = await fetch('/api/scan/delete', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repoPath }),
            });
            if (res.ok) {
              setKnownRepos(prev => prev.filter(r => r.path !== repoPath));
              if (selectedExisting === repoPath) setSelectedExisting(null);
            }
          } catch { /* non-fatal */ }
        }

        // ── Step 1 → Step 2 transition ──
        async function proceedToStep2() {
          let repoPath = '';
          if (mode === 'existing' && selectedExisting) {
            repoPath = selectedExisting;
          } else if (mode === 'new' && newRepoPath.trim()) {
            repoPath = newRepoPath.trim();
            // Register the new repo path on the server
            try {
              const res = await fetch('/api/repos/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repoPath }),
              });
              if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                setParseError(err.error || 'Could not add repository path.');
                return;
              }
            } catch (err) {
              setParseError(err.message || 'Network error.');
              return;
            }
          } else {
            return;
          }
          // For existing repos, switch the server's active repo FIRST
          // so that subsequent /api/ai-status reads from the correct repo
          if (mode === 'existing') {
            try {
              await fetch('/api/repos/switch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repoPath }),
              });
            } catch { /* non-fatal, ai-status may still work */ }
          }
          setStep(2);
          // Auto-start the parse if mode is 'new'
          if (mode === 'new') {
            startParse(repoPath);
          } else {
            // Existing repo: fetch its AI status and skip to step 3 if ai_enriched,
            // or show appropriate instructions if not
            try {
              const r = await fetch('/api/ai-status');
              const data = r.ok ? await r.json() : null;
              const st = data ? data.state : 'none';
              setAiState(st);
              if (st === 'ai_enriched') {
                await loadFinalStats();
                setStep(3);
              } else if (st === 'prompt_ready') {
                setParseStatus('done');
                setParseDone({ alreadyScanned: true });
              } else if (st === 'parser_only') {
                setParseStatus('done');
                setParseDone({ alreadyScanned: true });
                // Auto-generate prompt since parser already ran
                setPromptGenerating(true);
                try {
                  const promptRes = await fetch('/api/scan-prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repoPath }),
                  });
                  if (promptRes.ok) {
                    const promptData = await promptRes.json();
                    setPromptResult(promptData);
                    setAiState('prompt_ready');
                  }
                } catch { /* non-fatal */ }
                setPromptGenerating(false);
              } else {
                // Has no data — start scan
                startParse(repoPath);
              }
            } catch { startParse(repoPath); }
          }
        }

        // ── Run parse/scan via SSE ──
        async function startParse(repoPath) {
          setParseStatus('running');
          setParseError('');
          setParseLogs([]);
          setParseProgress({ percent: 0, index: 0, total: 0, file: '' });
          setParseDone(null);
          try {
            const res = await fetch('/api/scan/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repoPath }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.error || 'Scan failed to start');
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop();
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                  const evt = JSON.parse(line.slice(6));
                  if (evt.type === 'progress') {
                    setParseProgress({ index: evt.index, total: evt.total, percent: evt.percent || 0, file: evt.file || '' });
                    setParseLogs(prev => [...prev.slice(-20), { text: evt.message, cls: '' }]);
                  } else if (evt.type === 'done') {
                    setParseStatus('done');
                    setParseDone({ routeCount: evt.routeCount, fileCount: evt.fileCount, durationMs: evt.durationMs });
                    setParseLogs(prev => [...prev.slice(-20), { text: evt.message, cls: 'ok' }]);
                    // Auto-generate SCAN_INSTRUCTIONS.md
                    setPromptGenerating(true);
                    try {
                      const promptRes = await fetch('/api/scan-prompt', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ repoPath }),
                      });
                      if (promptRes.ok) {
                        const promptData = await promptRes.json();
                        setPromptResult(promptData);
                        setAiState('prompt_ready');
                      }
                    } catch { /* non-fatal */ }
                    setPromptGenerating(false);
                    // Fetch AI status after scan + prompt generation
                    const sr = await fetch('/api/ai-status');
                    const sd = sr.ok ? await sr.json() : null;
                    if (sd && sd.state) setAiState(sd.state);
                  } else if (evt.type === 'error') {
                    setParseStatus('error');
                    setParseError(evt.message);
                    setParseLogs(prev => [...prev.slice(-20), { text: 'Error: ' + evt.message, cls: 'error' }]);
                  }
                } catch { /* ignore */ }
              }
            }
          } catch (err) {
            setParseStatus('error');
            setParseError(err.message || String(err));
          }
        }

        // ── Step 2 → Step 3 ──
        async function proceedToStep3() {
          await loadFinalStats();
          setStep(3);
        }

        async function loadFinalStats() {
          try {
            const r = await fetch('/api/apis');
            if (r.ok) {
              const data = await r.json();
              const apis = Array.isArray(data.apis) ? data.apis : [];
              setFinalApis(apis);
              const tSet = new Set();
              apis.forEach(a => (a.tables || []).forEach(t => tSet.add(t)));
              setFinalTables(tSet.size);
            }
          } catch { /* non-fatal */ }
        }

                      dirSuggestions.map(d => h('div', {

                        onMouseDown: () => pickDirSugg(d)
                      }, [
                        h('span', { className: 'dir-icon', key: 'ic' }, '📂'),

                        h('span', { style: { fontSize: 9, color: 'var(--text-muted)', fontFamily: 'monospace', marginLeft: 'auto' }, key: 'p' }, d)

                h('button', {

              // Directory browser panel

          const repoFullPath = mode === 'existing' ? selectedExisting : newRepoPath || '.';
          const aiInstructionText = 'Follow the instructions in ' + repoFullPath + '/.routeweave/SCAN_INSTRUCTIONS.md';

          function pipelineStepState(idx) {
            // idx 0 = parse, idx 1 = generate instructions (auto), idx 2 = AI enrichment (manual)
            if (idx === 0) {
              if (parseStatus === 'running') return 'active';
              if (parseStatus === 'done' || parseStatus === 'error') return parseStatus;
              return 'idle';
            }
            if (idx === 1) {
              if (promptGenerating) return 'active';
              if (aiState === 'prompt_ready' || aiState === 'ai_enriched' || promptResult) return 'done';
              if (parseStatus === 'done') return 'active';
              return 'idle';
            }
            if (idx === 2) {
              if (aiState === 'ai_enriched') return 'done';
              if (aiState === 'prompt_ready' || promptResult) return 'active';
              return 'idle';
            }
            return 'idle';
          }

          function pipelineIcon(idx) {
            const st = pipelineStepState(idx);
            if (st === 'done') return '✓';
            if (st === 'running' || st === 'active') return h('div', { className: 'spinner spin-anim', style: { width: 14, height: 14, border: '2px solid rgba(79,124,255,0.2)', borderTopColor: 'var(--blue)', borderRadius: '50%' }, key: 'sp' });
            if (st === 'error') return '✗';
            if (idx === 0) return '⚡';
            if (idx === 1) return '📄';
            return '🤖';
          }

          return h(React.Fragment, {}, [
            h('div', { className: 'setup-step-title', key: 'title' }, 'Parse & AI Enrichment'),
            h('div', { className: 'setup-step-desc', key: 'desc' },
              'Routeweave is scanning ' + repoName + ', extracting routes and database access patterns, then generating AI-enriched API knowledge.'),

            h('div', { className: 'setup-pipeline', key: 'pipeline' }, [
              // Pipeline Step 1: Code parse
              h('div', {
                key: 'p0',
                className: 'setup-pipeline-step ' + pipelineStepState(0)
              }, [
                h('div', { className: 'setup-pipeline-icon', key: 'ic' }, pipelineIcon(0)),
                h('div', { className: 'setup-pipeline-body', key: 'body' }, [
                  h('div', { className: 'setup-pipeline-title', key: 't' }, 'Step 1 — Static Code Analysis'),
                  h('div', { className: 'setup-pipeline-desc', key: 'd' },
                    'Traverses source files, extracts API routes, SQL patterns, and ORM calls.'),
                  parseStatus === 'running' ? h('div', { className: 'setup-scan-progress', key: 'prog' }, [
                    h('div', { className: 'setup-scan-bar-wrap', key: 'bar' }, [
                      h('div', { className: 'setup-scan-bar-fill', key: 'fill', style: { width: parseProgress.percent + '%' } })
                    ]),
                    parseLogs.length > 0 ? h('div', { className: 'setup-scan-log', key: 'log' },
                      parseLogs.slice(-6).map((l, i) =>
                        h('div', { key: i, className: 'setup-scan-log-line ' + (l.cls || '') }, l.text)
                      )
                    ) : null
                  ]) : null,
                  parseDone ? h('div', { className: 'setup-pipeline-status done', key: 'done' }, [
                    h('span', { key: 'ic' }, '✓'),
                    parseDone.alreadyScanned
                      ? 'Previously scanned — data loaded'
                      : (parseDone.routeCount || 0) + ' routes · ' + (parseDone.fileCount || 0) + ' files'
                  ]) : null,
                  parseError ? h('div', { className: 'setup-pipeline-status error', key: 'err' }, '✗ ' + parseError) : null,
                  parseStatus === 'idle' ? h('div', { className: 'setup-pipeline-status waiting', key: 'wait' }, 'Waiting to start…') : null,
                ])
              ]),

              // Pipeline Step 2: Generate SCAN_INSTRUCTIONS.md (automatic)
              h('div', {
                key: 'p1',
                className: 'setup-pipeline-step ' + pipelineStepState(1)
              }, [
                h('div', { className: 'setup-pipeline-icon', key: 'ic' }, pipelineIcon(1)),
                h('div', { className: 'setup-pipeline-body', key: 'body' }, [
                  h('div', { className: 'setup-pipeline-title', key: 't' }, 'Step 2 — Generating AI Instructions'),
                  h('div', { className: 'setup-pipeline-desc', key: 'd' },
                    'Creates SCAN_INSTRUCTIONS.md with detailed prompts for your AI assistant.'),
                  promptGenerating
                    ? h('div', { className: 'setup-pipeline-status waiting', key: 'gen' }, 'Generating instructions…')

                  (promptResult || aiState === 'prompt_ready' || aiState === 'ai_enriched')

                        h('span', { key: 'ic' }, '✓'),

                      ])
                    : null,
                  pipelineStepState(1) === 'idle'
                    ? h('div', { className: 'setup-pipeline-status waiting', key: 'wait' }, 'Waiting for parse to complete…')

              }, ['Continue →']) :

              h('button', {
                key: 'launch',

              }, ['🚀 Open Dashboard'])
            ])
          ])
        ]);

      /* ---- Main App ---- */
      function App() {
        const [rawApis, setRawApis] = useState(fallbackApis);

        const [impactService, setImpactService] = useState('');

        const [scanStatsLoading, setScanStatsLoading] = useState(false);

        // ── Scanner: new-scan state ──
        const [scanRepoPath, setScanRepoPath] = useState('');

        const [scanProgress, setScanProgress] = useState({ index: 0, total: 0, percent: 0, file: '' });
        const [scanLiveLog, setScanLiveLog] = useState([]);
        const [scanDone, setScanDone] = useState(null);   // { routeCount, fileCount, durationMs, coverageScore, coverageGrade }
        const [scanError, setScanError] = useState('');
        const [dirSuggestions, setDirSuggestions] = useState([]);

        // ── AI enrichment status ──
        const [aiStatus, setAiStatus] = useState(null);   // null | { state, promptPath, repoDir }

        const [cmdCopied, setCmdCopied] = useState(false);

        const apis = useMemo(() => normalizeApis(rawApis), [rawApis]);
        const filteredApis = useMemo(() => {
          const v = search.trim().toLowerCase();

        const availableImpactColumns = useMemo(() => {
          if (!impactTable) return [];

        const filteredScanFiles = useMemo(() => {

        }, [scanStats, scanFileSearch]);

        /* Animated count-up */
        useEffect(() => {
          const target = impactResults.length;
          if (target === 0) { setAnimatedCount(0); return; }
          let current = 0;
          const step = Math.max(1, Math.ceil(target / 20));
          const interval = setInterval(() => {
            current = Math.min(current + step, target);
            setAnimatedCount(current);
            if (current >= target) clearInterval(interval);
          }, 30);
          return () => clearInterval(interval);
        }, [impactResults.length]);

        function addLog(msg, type) {
          const now = new Date();
          const time = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
          setLogs(prev => [...prev.slice(-20), { time, msg, type }]);

        // ── Directory autocomplete ────────────────────────────────────────────
        async function fetchDirs(p) {
          try {

        function onScanPathChange(e) {

          setScanRepoPath(dir);
          setShowDirs(false);

        }

        // ── Start scan via SSE ────────────────────────────────────────────────
        async function startScan() {
          const rp = scanRepoPath.trim();
          if (!rp) return;
          setScanRunning(true);
          setScanDone(null);
          setScanError('');
          setScanProgress({ index: 0, total: 0, percent: 0, file: '' });
          setScanLiveLog([]);
          addLog('Starting scan: ' + rp, 'ok');

          try {
            const res = await fetch('/api/scan/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repoPath: rp }),
            });

            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.error || 'Scan failed to start');
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop();  // last partial line stays in buf

              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                  const event = JSON.parse(line.slice(6));
                  if (event.type === 'progress') {
                    setScanProgress({ index: event.index, total: event.total, percent: event.percent || 0, file: event.file || '' });
                    setScanLiveLog(prev => [...prev.slice(-30), { text: event.message, cls: '' }]);
                  } else if (event.type === 'done') {
                    setScanDone({ routeCount: event.routeCount, fileCount: event.fileCount, durationMs: event.durationMs, coverageScore: event.coverageScore, coverageGrade: event.coverageGrade });
                    setScanLiveLog(prev => [...prev.slice(-30), { text: event.message, cls: 'ok' }]);
                    addLog(event.message, 'ok');
                    // Reload APIs, scan stats, and repo registry
                    await reloadData();
                    await fetchRepos();
                    await fetchAiStatus();
                  } else if (event.type === 'error') {
                    setScanError(event.message);
                    setScanLiveLog(prev => [...prev.slice(-30), { text: 'Error: ' + event.message, cls: 'error' }]);
                    addLog('Scan error: ' + event.message, 'warn');
                  }
                } catch { /* ignore parse errors */ }
              }
            }
          } catch (err) {
            const msg = err && err.message ? err.message : String(err);
            setScanError(msg);
            addLog('Scan failed: ' + msg, 'warn');
          } finally {
            setScanRunning(false);
          }
        }

        async function deleteScan() {
          if (!activeRepoPath) return;
          try {
            const res = await fetch('/api/scan/delete', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repoPath: activeRepoPath }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              addLog('Delete failed: ' + (err.error || 'unknown'), 'warn');
              return;
            }
            const data = await res.json();
            addLog('Deleted scan data: ' + (data.deleted || []).join(', '), 'ok');
            setRawApis(fallbackApis);
            setScanStats(null);
            setScanDone(null);
            setScanError('');
            setScanLiveLog([]);
            setSelectedScanFile(null);
            await fetchRepos();
            await fetchAiStatus();
          } catch (err) {
            addLog('Delete error: ' + (err.message || String(err)), 'warn');
          }
        }

        async function startRescan() {
          const rp = scanRepoPath.trim() || activeRepoPath;
          if (!rp) return;
          setScanRepoPath(rp);
          setScanRunning(true);
          setScanDone(null);
          setScanError('');
          setScanProgress({ index: 0, total: 0, percent: 0, file: '' });
          setScanLiveLog([]);
          addLog('Rescan (delete + full scan): ' + rp, 'ok');

          try {
            const res = await fetch('/api/scan/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repoPath: rp, rescan: true }),
            });

            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.error || 'Rescan failed to start');
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop();

              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                  const event = JSON.parse(line.slice(6));
                  if (event.type === 'progress') {
                    setScanProgress({ index: event.index, total: event.total, percent: event.percent || 0, file: event.file || '' });
                    setScanLiveLog(prev => [...prev.slice(-30), { text: event.message, cls: '' }]);
                  } else if (event.type === 'done') {
                    setScanDone({ routeCount: event.routeCount, fileCount: event.fileCount, durationMs: event.durationMs, coverageScore: event.coverageScore, coverageGrade: event.coverageGrade });
                    setScanLiveLog(prev => [...prev.slice(-30), { text: event.message, cls: 'ok' }]);
                    addLog(event.message, 'ok');
                    await reloadData();
                    await fetchRepos();
                    await fetchAiStatus();
                  } else if (event.type === 'error') {
                    setScanError(event.message);
                    setScanLiveLog(prev => [...prev.slice(-30), { text: 'Error: ' + event.message, cls: 'error' }]);
                    addLog('Rescan error: ' + event.message, 'warn');
                  }
                } catch { /* ignore parse errors */ }
              }
            }
          } catch (err) {
            const msg = err && err.message ? err.message : String(err);
            setScanError(msg);
            addLog('Rescan failed: ' + msg, 'warn');
          } finally {
            setScanRunning(false);
          }
        }

        // ── Reload APIs + scan stats + impact data after a scan or repo switch ─
        async function reloadData() {
          try {
            const res = await fetch('/api/apis');
            if (res.ok) {
              const payload = await res.json();
              const loaded = Array.isArray(payload.apis) ? payload.apis : [];
              setRawApis(loaded.length > 0 ? loaded : fallbackApis);
            }
          } catch { /* keep current apis */ }
          try {
            const res = await fetch('/api/scan-stats');
            if (res.ok) {
              const data = await res.json();
              setScanStats(data);
            } else {
              setScanStats(null);
            }
          } catch { setScanStats(null); }
        }

        // ── Fetch repo registry from server ───────────────────────────────────
        async function fetchRepos() {
          try {
            const res = await fetch('/api/repos');
            if (res.ok) {
              const data = await res.json();
              setRepos(Array.isArray(data.repos) ? data.repos : []);
              setActiveRepoPath(data.active || '');

          } catch { /* non-fatal */ }

        async function fetchAiStatus() {
          try {

        async function runImpactQuery(category, opts) {
          setImpactLoading(true);
          const params = new URLSearchParams();
          if (category === 'tables') {
            const tv = String(opts.table || '').trim(), cv = String(opts.column || '').trim();
            if (tv) params.set('table', tv);
            if (cv) params.set('column', cv);
            if (tv) addLog('Analyzing impact for ' + tv + (cv ? '.' + cv : '') + '...', 'ok');
          } else if (category === 'dependencies') {
            const dv = String(opts.dependency || '').trim();
            if (dv) params.set('dependency', dv);
            if (dv) addLog('Analyzing impact for dependency ' + dv + '...', 'ok');
          } else if (category === 'services') {
            const sv = String(opts.service || '').trim();
            if (sv) params.set('service', sv);
            if (sv) addLog('Analyzing impact for service ' + sv + '...', 'ok');
          }
          try {
            const suffix = params.toString() ? '?' + params.toString() : '';
            const res = await fetch('/api/impact' + suffix);
            if (!res.ok) throw new Error('Impact cache unavailable.');
            const payload = await res.json();
            setImpactTables(Array.isArray(payload.tables) ? payload.tables : []);
            setImpactDependencies(Array.isArray(payload.dependencies) ? payload.dependencies : []);
            setImpactServices(Array.isArray(payload.services) ? payload.services : []);
            setImpactResults(Array.isArray(payload.results) ? payload.results : []);
            setImpactError('');
            const count = (payload.results || []).length;
            if (category === 'tables' && opts.table) addLog('Found ' + count + ' impacted APIs', 'ok');
            if (category === 'dependencies' && opts.dependency) addLog('Found ' + count + ' impacted APIs', 'ok');
            if (category === 'services' && opts.service) addLog('Found ' + count + ' impacted APIs', 'ok');
          } catch (err) {
            // Local fallback: build catalogs from loaded APIs
            const localDepCatalog = buildLocalDependencyCatalog(apis);
            const localSvcCatalog = buildLocalServiceCatalog(apis);
            setImpactDependencies(localDepCatalog);
            setImpactServices(localSvcCatalog);
            if (category === 'tables') {
              const local = buildLocalImpactPayload(apis, { table: opts.table || '', column: opts.column || '' });
              setImpactTables(local.tables);
              setImpactResults(local.results);
            } else if (category === 'dependencies') {
              // Local dependency impact: filter APIs by matching dependency
              const dv = String(opts.dependency || '').trim().toLowerCase();
              if (dv) {
                const results = (apis || []).filter(a => (a.dependencies || []).some(d => d.toLowerCase() === dv))
                  .map(a => ({ method: a.method, path: a.path, summary: a.summary, dependency: opts.dependency, impact: 'uses', how: 'Uses dependency ' + opts.dependency }))
                  .sort((a, b) => (a.method + ' ' + a.path).localeCompare(b.method + ' ' + b.path));
                setImpactResults(results);
              } else {
                setImpactResults([]);
              }
            } else if (category === 'services') {
              // Local service impact: filter APIs by matching service
              const sv = String(opts.service || '').trim().toLowerCase();
              if (sv) {
                const results = (apis || []).filter(a => (a.services || []).some(s => s.toLowerCase() === sv))
                  .map(a => ({ method: a.method, path: a.path, summary: a.summary, service: opts.service, impact: 'calls', how: 'Calls external service ' + opts.service }))
                  .sort((a, b) => (a.method + ' ' + a.path).localeCompare(b.method + ' ' + b.path));
                setImpactResults(results);
              } else {
                setImpactResults([]);
              }
            } else {
              setImpactResults([]);
            }
            const hasFilter = (category === 'tables' && opts.table) || (category === 'dependencies' && opts.dependency) || (category === 'services' && opts.service);
            setImpactError(hasFilter ? (err.message || 'Using local inference.') : '');
            if (hasFilter) addLog('Using locally inferred impact data', 'warn');
          } finally {
            setImpactLoading(false);
          }
        }

        useEffect(() => {

        useEffect(() => {

        }, [apis]);

          }, h(SvgIcon, { d: 'M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z' }))
        ]);

        /* ---- Top Bar ---- */
        const activeRepoLabel = repos.find(r => r.path === activeRepoPath)
          ? repos.find(r => r.path === activeRepoPath).label

        const topbar = h('header', { className: 'topbar', key: 'topbar' }, [

          ]),

            h('input', {

            })
          ]),
          h('div', { className: 'topbar-stats', key: 'stats' }, [
            h('div', { className: 'topbar-stat', key: 's1' }, [

              h('span', { className: 'label', key: 'l' }, 'APIs')
            ]),
